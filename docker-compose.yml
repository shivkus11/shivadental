services:
  postgres:
    image: postgres:16
    container_name: dental-clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dental_clinic_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dental_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dental_clinic_db:
